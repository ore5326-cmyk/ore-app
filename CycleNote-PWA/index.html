<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CycleNote - 簡単自転車記録</title>
  
  <!-- SEO & PWA Meta Tags -->
  <meta name="description" content="3タップ以内で記録できるシンプルな自転車サイクリング＆メンテナンスログ">
  <meta name="theme-color" content="#0d9488">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CycleNote">
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Google Fonts: Outfit and Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- App Container -->
  <div class="app-container">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-logo">
        <svg class="header-logo-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="5" cy="17" r="4" />
          <circle cx="19" cy="17" r="4" />
          <polygon points="5,17 10.5,17 9,9.5" />
          <polygon points="9,9.5 16,9.5 10.5,17" />
          <line x1="9" y1="9.5" x2="8.7" y2="8.0" />
          <line x1="7.5" y1="8.0" x2="9.5" y2="8.0" stroke-width="2.2" />
          <line x1="16" y1="9.5" x2="19" y2="17" />
          <path d="M 16 9.5 L 16.5 8.0 L 18.0 8.0 M 18.0 8.0 Q 19.0 8.0 19.0 9.0 Q 19.0 10.0 17.5 10.0" />
        </svg>
        <span class="header-title">CycleNote</span>
      </div>
      <button id="theme-toggle-btn" class="header-action-btn" aria-label="テーマ切替">
        <!-- Sun Icon (shown in dark mode) -->
        <svg class="sun-icon" viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.02-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41zm-12.37 12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41z"/>
        </svg>
        <!-- Moon Icon (shown in light mode) -->
        <svg class="moon-icon" viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M12.3 22h-.1c-5.4-.4-9.8-4.8-10.2-10.2-.4-5.4 3-10.3 8.2-11.6.6-.1 1.2.2 1.4.7.2.5.1 1.1-.3 1.5-2.3 2.3-3 5.8-1.7 8.8 1.3 3 4.3 4.9 7.6 4.9 1 0 2-.2 3-.7.5-.2 1.1-.1 1.5.3.4.4.5 1 .3 1.5-1.4 5.2-6.3 8.6-11.7 8.2z"/>
        </svg>
      </button>
    </header>

    <!-- Main Scrollable Content -->
    <main class="app-main">
      
      <!-- Home Tab View -->
      <section id="view-home" class="view active">

        <!-- ===== IDLE STATE: 出発ボタン ===== -->
        <div id="cycling-idle-section" class="section-container">
          <h2 class="section-title">
            <svg class="sec-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="5" cy="17" r="4" />
              <circle cx="19" cy="17" r="4" />
              <polygon points="5,17 10.5,17 9,9.5" />
              <polygon points="9,9.5 16,9.5 10.5,17" />
              <line x1="9" y1="9.5" x2="8.7" y2="8.0" />
              <line x1="7.5" y1="8.0" x2="9.5" y2="8.0" stroke-width="2.2" />
              <line x1="16" y1="9.5" x2="19" y2="17" />
              <path d="M 16 9.5 L 16.5 8.0 L 18.0 8.0 M 18.0 8.0 Q 19.0 8.0 19.0 9.0 Q 19.0 10.0 17.5 10.0" />
            </svg>
            サイクリング記録
          </h2>
          <button id="btn-departure" class="departure-btn">
            <span class="departure-btn-icon">🚴</span>
            <span class="departure-btn-label">出発</span>
            <span class="departure-btn-sub">タップして出発時刻を記録</span>
          </button>
        </div>

        <!-- ===== RIDING STATE: 帰宅 / キャンセル ===== -->
        <div id="cycling-riding-section" class="section-container" style="display:none;">
          <h2 class="section-title">
            <svg class="sec-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="5" cy="17" r="4" />
              <circle cx="19" cy="17" r="4" />
              <polygon points="5,17 10.5,17 9,9.5" />
              <polygon points="9,9.5 16,9.5 10.5,17" />
              <line x1="9" y1="9.5" x2="8.7" y2="8.0" />
              <line x1="7.5" y1="8.0" x2="9.5" y2="8.0" stroke-width="2.2" />
              <line x1="16" y1="9.5" x2="19" y2="17" />
              <path d="M 16 9.5 L 16.5 8.0 L 18.0 8.0 M 18.0 8.0 Q 19.0 8.0 19.0 9.0 Q 19.0 10.0 17.5 10.0" />
            </svg>
            ライド中 🏃
          </h2>
          <!-- Departure time banner -->
          <div class="ride-status-card">
            <div class="ride-status-label">出発時刻</div>
            <div class="ride-status-time" id="ride-departure-display">--:--</div>
            <div class="ride-elapsed" id="ride-elapsed-display">経過時間を計算中...</div>
          </div>
          <!-- Return / Cancel -->
          <div class="ride-action-grid">
            <button id="btn-return" class="return-btn">
              <span class="return-btn-icon">🏠</span>
              <span class="return-btn-label">帰宅</span>
              <span class="return-btn-sub">時間を自動計算して記録</span>
            </button>
            <button id="btn-cancel-ride" class="cancel-ride-btn">
              <span class="cancel-btn-icon">✕</span>
              <span class="cancel-btn-label">キャンセル</span>
            </button>
          </div>
        </div>

        <!-- Maintenance Quick Actions -->
        <div class="section-container mt-section">
          <h2 class="section-title">
            <svg class="sec-icon" viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.3C.5 6.7.9 9.8 2.9 11.8c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.6z"/>
            </svg>
            メンテナンス記録
          </h2>
          <div class="quick-grid">
            <button class="quick-btn maint-btn" data-task="チェーン注油">
              <span class="btn-main">チェーン注油</span>
              <span class="btn-sub">Lubricate Chain</span>
            </button>
            <button class="quick-btn maint-btn" data-task="チェーン清掃">
              <span class="btn-main">チェーン清掃</span>
              <span class="btn-sub">Clean Chain</span>
            </button>
            <button class="quick-btn maint-btn" data-task="空気補充">
              <span class="btn-main">空気補充</span>
              <span class="btn-sub">Inflate Tires</span>
            </button>
            <button class="quick-btn maint-btn" data-task="フレーム清掃">
              <span class="btn-main">フレーム清掃</span>
              <span class="btn-sub">Clean Frame</span>
            </button>
            <button class="quick-btn maint-btn spec-other" id="btn-maint-other">
              <span class="btn-main">その他...</span>
              <span class="btn-sub">Other Tasks</span>
            </button>
          </div>
        </div>
      </section>

      <!-- History Tab View -->
      <section id="view-history" class="view">
        <div class="section-container">
          <div class="history-header">
            <h2 class="section-title">
              <svg class="sec-icon" viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
              </svg>
              ログ履歴
            </h2>
            <div class="history-header-actions">
              <button type="button" id="btn-export-data" class="history-data-btn" aria-label="データをエクスポート" title="バックアップを保存">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              </button>
              <button type="button" id="btn-import-data" class="history-data-btn" aria-label="データをインポート" title="バックアップから復元">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              </button>
              <input type="file" id="import-file-input" accept=".json,application/json" hidden>
              <div class="history-stats" id="history-counter">0件</div>
            </div>
          </div>

          <div class="history-tabs" role="tablist" aria-label="履歴の種類">
            <button type="button" class="history-tab active" data-filter="cycling" role="tab" aria-selected="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="5" cy="17" r="4"/><circle cx="19" cy="17" r="4"/>
                <polygon points="5,17 10.5,17 9,9.5"/><polygon points="9,9.5 16,9.5 10.5,17"/>
              </svg>
              <span>サイクリング</span>
            </button>
            <button type="button" class="history-tab" data-filter="maintenance" role="tab" aria-selected="false">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.3C.5 6.7.9 9.8 2.9 11.8c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.6z"/></svg>
              <span>メンテナンス</span>
            </button>
          </div>
          
          <!-- History List container -->
          <div id="history-list" class="history-list">
            <!-- Dynamically populated via JS -->
            <div class="empty-state">
              <div class="empty-icon">🚴</div>
              <p>記録がまだありません。<br>ホームからサイクリングやメンテナンスを記録しましょう！</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <button id="nav-home" class="nav-item active">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        <span>ホーム</span>
      </button>
      <button id="nav-history" class="nav-item">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
        </svg>
        <span>履歴</span>
      </button>
    </nav>
  </div>

  <!-- ==================== MODALS & SHEETS ==================== -->

  <!-- Cycling Form Modal Sheet -->
  <div id="modal-cycling" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="modal-title">サイクリング記録</h3>
        <button class="modal-close" data-close-target="modal-cycling" aria-label="閉じる">&times;</button>
      </div>
      <form id="form-cycling" class="modal-body">
        <input type="hidden" id="cycling-id">
        
        <div class="form-group">
          <label for="cycling-date" class="form-label">日付</label>
          <input type="date" id="cycling-date" class="form-input" required>
        </div>

        <div class="form-group">
          <label class="form-label">行き先</label>
          <!-- Preset radio buttons -->
          <div class="dest-radio-group" id="dest-radio-group">
            <label class="dest-radio-item">
              <input type="radio" name="cycling-dest-radio" value="権現ダム">
              <span class="dest-radio-label">権現ダム</span>
            </label>
            <label class="dest-radio-item">
              <input type="radio" name="cycling-dest-radio" value="向島公園">
              <span class="dest-radio-label">向島公園</span>
            </label>
            <label class="dest-radio-item">
              <input type="radio" name="cycling-dest-radio" value="大蔵海岸">
              <span class="dest-radio-label">大蔵海岸</span>
            </label>
            <label class="dest-radio-item">
              <input type="radio" name="cycling-dest-radio" value="明石海峡大橋">
              <span class="dest-radio-label">明石海峡大橋</span>
            </label>
            <label class="dest-radio-item">
              <input type="radio" name="cycling-dest-radio" value="舞子公園">
              <span class="dest-radio-label">舞子公園</span>
            </label>
          </div>
          <!-- Free text input + picker button -->
          <div class="dest-custom-row">
            <input type="text" id="cycling-dest" class="form-input dest-custom-input" placeholder="または自由入力..." required>
            
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-6">
            <label for="cycling-dist" class="form-label">距離 (km)</label>
            <input type="number" id="cycling-dist" class="form-input" placeholder="例: 25.5" step="any" min="0" inputmode="decimal">
          </div>
          <div class="form-group col-6">
            <label class="form-label">全体時間 <span class="form-label-auto">自動計算</span></label>
            <div class="time-input-container">
              <input type="number" id="cycling-total-h" class="form-input time-part" placeholder="時間" min="0">
              <span class="time-sep">:</span>
              <input type="number" id="cycling-total-m" class="form-input time-part" placeholder="分" min="0" max="59">
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-12">
            <label for="cycling-ride-time" class="form-label">走行時間 (hh:mm)</label>
            <div class="time-input-container">
              <input type="number" id="cycling-ride-h" class="form-input time-part" placeholder="時間" min="0">
              <span class="time-sep">:</span>
              <input type="number" id="cycling-ride-m" class="form-input time-part" placeholder="分" min="0" max="59">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="cycling-memo" class="form-label">メモ</label>
          <textarea id="cycling-memo" class="form-input form-textarea" placeholder="路面状況、向かい風、コンディションなど..."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" data-close-target="modal-cycling">キャンセル</button>
          <button type="submit" class="btn-primary">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Maintenance Form Modal Sheet -->
  <div id="modal-maintenance" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="modal-title">メンテナンス記録</h3>
        <button class="modal-close" data-close-target="modal-maintenance" aria-label="閉じる">&times;</button>
      </div>
      <form id="form-maintenance" class="modal-body">
        <input type="hidden" id="maint-id">

        <div class="form-group">
          <label for="maint-date" class="form-label">日付</label>
          <input type="date" id="maint-date" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="maint-task" class="form-label">作業名</label>
          <input type="text" id="maint-task" class="form-input" placeholder="例: チェーン注油" required>
        </div>

        <div class="form-group">
          <label for="maint-memo" class="form-label">メモ</label>
          <textarea id="maint-memo" class="form-input form-textarea" placeholder="使用オイル、ネジの締め付けトルク、消耗度など..."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" data-close-target="modal-maintenance">キャンセル</button>
          <button type="submit" class="btn-primary">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Other Maintenance Tasks Categories Dialog Sheet -->
  <div id="modal-maint-other" class="modal-overlay">
    <div class="modal-sheet modal-medium full-height-mobile">
      <div class="modal-header">
        <h3 class="modal-title">作業項目を選択</h3>
        <button class="modal-close" data-close-target="modal-maint-other" aria-label="閉じる">&times;</button>
      </div>
      <div class="modal-body list-selection-body scrollable-y">
        <div class="accordion-container">
          <!-- 駆動系 -->
          <div class="accordion-group">
            <div class="accordion-header">
              <span>駆動系 (Drivetrain)</span>
              <svg class="chevron-icon" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </div>
            <div class="accordion-content">
              <button class="select-maint-item-btn" data-task="チェーン完全脱脂">チェーン完全脱脂</button>
              <button class="select-maint-item-btn" data-task="スプロケット清掃">スプロケット清掃</button>
              <button class="select-maint-item-btn" data-task="クランク清掃">クランク清掃</button>
              <button class="select-maint-item-btn" data-task="チェーン交換">チェーン交換</button>
              <button class="select-maint-item-btn" data-task="スプロケット交換">スプロケット交換</button>
              <button class="select-maint-item-btn" data-task="チェーンリング交換">チェーンリング交換</button>
            </div>
          </div>

          <!-- タイヤ -->
          <div class="accordion-group">
            <div class="accordion-header">
              <span>タイヤ (Tires)</span>
              <svg class="chevron-icon" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </div>
            <div class="accordion-content">
              <button class="select-maint-item-btn" data-task="タイヤ交換">タイヤ交換</button>
              <button class="select-maint-item-btn" data-task="チューブ交換">チューブ交換</button>
              <button class="select-maint-item-btn" data-task="パンク修理">パンク修理</button>
            </div>
          </div>

          <!-- ブレーキ -->
          <div class="accordion-group">
            <div class="accordion-header">
              <span>ブレーキ (Brakes)</span>
              <svg class="chevron-icon" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </div>
            <div class="accordion-content">
              <button class="select-maint-item-btn" data-task="ブレーキ調整">ブレーキ調整</button>
              <button class="select-maint-item-btn" data-task="ブレーキシュー交換">ブレーキシュー交換</button>
            </div>
          </div>

          <!-- 変速 -->
          <div class="accordion-group">
            <div class="accordion-header">
              <span>変速 (Shifting)</span>
              <svg class="chevron-icon" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </div>
            <div class="accordion-content">
              <button class="select-maint-item-btn" data-task="ディレイラー調整">ディレイラー調整</button>
              <button class="select-maint-item-btn" data-task="シフトワイヤー交換">シフトワイヤー交換</button>
            </div>
          </div>

          <!-- ホイール -->
          <div class="accordion-group">
            <div class="accordion-header">
              <span>ホイール (Wheels)</span>
              <svg class="chevron-icon" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </div>
            <div class="accordion-content">
              <button class="select-maint-item-btn" data-task="リム清掃">リム清掃</button>
              <button class="select-maint-item-btn" data-task="振れ取り">振れ取り</button>
            </div>
          </div>

          <!-- 車体 -->
          <div class="accordion-group">
            <div class="accordion-header">
              <span>車体 (Frame & Body)</span>
              <svg class="chevron-icon" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </div>
            <div class="accordion-content">
              <button class="select-maint-item-btn" data-task="フレームワックス">フレームワックス</button>
              <button class="select-maint-item-btn" data-task="ボルト増し締め">ボルト増し締め</button>
            </div>
          </div>

          <!-- その他 -->
          <div class="accordion-group">
            <div class="accordion-header">
              <span>その他 (Others)</span>
              <svg class="chevron-icon" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </div>
            <div class="accordion-content">
              <button class="select-maint-item-btn" data-task="アクセサリー追加">アクセサリー追加</button>
              <button class="select-maint-item-btn" data-task="アクセサリー交換">アクセサリー交換</button>
              
              <div class="selection-custom-input-group mt-2">
                <input type="text" id="maint-custom-task-input" class="form-input" placeholder="作業内容を自由入力...">
                <button type="button" id="btn-custom-maint-submit" class="btn-primary btn-sm">決定</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Detail & Action Dialog (Edit/Delete log) -->
  <div id="modal-detail" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="modal-title" id="detail-title">ログ詳細</h3>
        <button class="modal-close" data-close-target="modal-detail" aria-label="閉じる">&times;</button>
      </div>
      <div class="modal-body scrollable-y" id="detail-content">
        <!-- Dynamically populated via JS -->
      </div>
      <div class="modal-footer detail-actions">
        <button type="button" class="btn-danger" id="btn-detail-delete">削除</button>
        <div>
          <button type="button" class="btn-secondary" data-close-target="modal-detail">閉じる</button>
          <button type="button" class="btn-primary" id="btn-detail-edit">編集</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
