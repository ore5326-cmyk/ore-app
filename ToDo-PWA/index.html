<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ToDo</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a10">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ToDo">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#0a0a10;
    --bg-elevated:#14141d;
    --surface:#1a1a25;
    --surface-2:#20202c;
    --border:#282836;
    --text:#e9e9f2;
    --text-dim:#8b8b9c;
    --text-faint:#4a4a58;
    --accent-1:#7c6cf0;
    --accent-2:#5b8def;
    --accent-grad:linear-gradient(135deg,var(--accent-1),var(--accent-2));
    --danger:#ff5c7a;
    --danger-dim:rgba(255,92,122,.12);
    --danger-border:rgba(255,92,122,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",Roboto,sans-serif;
    overflow-x:hidden;
    min-height:100dvh;
  }

  /* ===== Header / category tabs ===== */
  .topbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:14px 12px;
    padding-top:calc(14px + env(safe-area-inset-top));
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:10;
  }
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
    flex:1;
    min-width:0;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0;
    padding:9px 18px;
    border-radius:20px;
    font-size:15px;
    font-weight:600;
    color:var(--text-dim);
    background:transparent;
    border:1px solid transparent;
    white-space:nowrap;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .tab.active{
    background:var(--accent-grad);
    color:#fff;
    box-shadow:0 4px 14px -4px rgba(124,108,240,.55);
  }
  .tab:active{ opacity:.8; }

  .icon-btn{
    flex-shrink:0;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{ background:var(--surface-2); }

  /* ===== Main content ===== */
  main{
    padding:20px 18px 140px;
    max-width:560px;
    margin:0 auto;
  }
  .section-label{
    font-size:13px;
    font-weight:700;
    color:var(--text-dim);
    letter-spacing:.03em;
    margin:0 0 14px;
  }
  .section-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0 0 14px;
  }

  .empty-state{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
    text-align:center;
  }
  .empty-state .emoji{ font-size:52px; margin-bottom:14px; filter:saturate(1.1); }
  .empty-state .line1{ color:var(--text-dim); font-size:15px; margin-bottom:4px; }
  .empty-state .line2{ color:var(--text-faint); font-size:13px; }

  .task-list{ display:flex; flex-direction:column; gap:8px; }
  .task-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:13px 14px;
  }
  .check{
    width:22px; height:22px;
    border-radius:50%;
    border:2px solid var(--text-faint);
    flex-shrink:0;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .15s ease, background .15s ease;
  }
  .check.checked{
    background:var(--accent-grad);
    border-color:transparent;
  }
  .check.checked::after{
    content:"";
    width:6px; height:10px;
    border-right:2px solid #fff;
    border-bottom:2px solid #fff;
    transform:rotate(45deg) translate(-1px,-1px);
  }
  .task-text{
    flex:1;
    font-size:15px;
    word-break:break-word;
    line-height:1.4;
  }
  .task-text.done{
    color:var(--text-faint);
    text-decoration:line-through;
  }
  .del-btn{
    flex-shrink:0;
    width:30px; height:30px;
    border-radius:8px;
    border:none;
    background:transparent;
    color:var(--text-faint);
    font-size:18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .del-btn:active{ background:var(--danger-dim); color:var(--danger); }

  .divider{
    height:1px;
    background:var(--border);
    margin:28px 0 20px;
  }

  .bulk-del{
    padding:7px 14px;
    border-radius:20px;
    border:1px solid var(--danger-border);
    background:var(--danger-dim);
    color:var(--danger);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .bulk-del:disabled{
    opacity:.35;
    cursor:default;
  }
  .bulk-del:not(:disabled):active{ background:rgba(255,92,122,.22); }

  .footer-version{
    text-align:center;
    color:var(--text-faint);
    font-size:12px;
    margin-top:40px;
  }

  /* ===== FAB ===== */
  .fab{
    position:fixed;
    right:22px;
    bottom:calc(26px + env(safe-area-inset-bottom));
    width:58px; height:58px;
    border-radius:50%;
    background:var(--accent-grad);
    border:none;
    color:#fff;
    font-size:28px;
    font-weight:400;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 28px -6px rgba(91,141,239,.65);
    cursor:pointer;
    z-index:20;
  }
  .fab:active{ transform:scale(.94); }

  /* ===== Sheet overlay (keyboard-safe) ===== */
  .overlay{
    position:fixed;
    left:0; top:0;
    width:100%;
    /* height/top set dynamically via JS to track visualViewport */
    background:rgba(0,0,0,.55);
    display:none;
    z-index:100;
  }
  .overlay.open{ display:block; }
  .sheet{
    position:absolute;
    left:0; right:0; bottom:0;
    background:var(--bg-elevated);
    border-top:1px solid var(--border);
    border-radius:20px 20px 0 0;
    padding:10px 20px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .2s ease;
  }
  /* sheet slides in only when .shown is applied, independent of .overlay.open,
     so we can show the backdrop immediately but delay the slide until the
     keyboard-adjusted viewport is known (avoids a double "jump") */
  .sheet.shown{ transform:translateY(0); }
  .sheet-handle{
    width:38px; height:4px;
    border-radius:3px;
    background:var(--border);
    margin:6px auto 16px;
  }
  .sheet-title{
    font-size:18px;
    font-weight:700;
    margin:0 0 16px;
  }
  .sheet input[type="text"]{
    width:100%;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:13px 14px;
    color:var(--text);
    font-size:15px;
    outline:none;
    margin-bottom:14px;
  }
  .sheet input[type="text"]:focus{
    border-color:var(--accent-1);
  }
  .sheet-row{
    display:flex;
    gap:10px;
  }
  .sheet-btn{
    flex:1;
    padding:13px 0;
    border-radius:12px;
    font-size:15px;
    font-weight:700;
    border:none;
    cursor:pointer;
  }
  .sheet-btn.cancel{
    background:var(--surface);
    color:var(--text-dim);
    border:1px solid var(--border);
  }
  .sheet-btn.cancel:active{ background:var(--surface-2); }
  .sheet-btn.primary{
    background:var(--accent-grad);
    color:#fff;
  }
  .sheet-btn.primary:active{ opacity:.85; }
  .sheet-btn.primary:disabled{
    opacity:.4;
    pointer-events:none;
  }

  /* action sheet list (menu for the top + button) */
  .menu-list{ display:flex; flex-direction:column; gap:4px; }
  .menu-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 8px;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    color:var(--text);
    background:transparent;
    border:none;
    cursor:pointer;
    text-align:left;
  }
  .menu-item:active{ background:var(--surface); }
  .menu-item .mi-icon{
    width:22px; text-align:center; font-size:17px; color:var(--text-dim);
  }
  .menu-item.danger{ color:var(--danger); }
  .menu-item.danger .mi-icon{ color:var(--danger); }

  #fileInput{ display:none; }

  .toast{
    position:fixed;
    left:50%; bottom:24px;
    transform:translateX(-50%) translateY(20px);
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 18px;
    border-radius:12px;
    font-size:13px;
    opacity:0;
    transition:opacity .2s ease, transform .2s ease;
    z-index:200;
    pointer-events:none;
    max-width:90%;
    text-align:center;
    word-break:break-all;
    line-height:1.5;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="topbar">
    <div class="tabs" id="tabs"></div>
    <button class="icon-btn" id="openTopMenu" aria-label="メニュー">+</button>
  </div>

  <main>
    <p class="section-label">タスク</p>
    <div id="taskArea"></div>

    <div class="divider"></div>

    <div class="section-row">
      <p class="section-label" style="margin:0;">完了</p>
      <button class="bulk-del" id="bulkDelBtn">一括削除</button>
    </div>
    <div id="doneArea"></div>

    <p class="footer-version">v1.7</p>
  </main>

  <button class="fab" id="fabAdd" aria-label="タスクを追加">+</button>

  <!-- Top "+" action menu: add category / backup -->
  <div class="overlay" id="menuOverlay">
    <div class="sheet" id="menuSheet">
      <div class="sheet-handle"></div>
      <p class="sheet-title">メニュー</p>
      <div class="menu-list">
        <button class="menu-item" id="menuAddCategory"><span class="mi-icon">＋</span>カテゴリを追加</button>
        <button class="menu-item" id="menuDeleteCategory"><span class="mi-icon">🗑</span>このカテゴリを削除</button>
        <button class="menu-item" id="menuBackupSave"><span class="mi-icon">⬇</span>バックアップを保存</button>
        <button class="menu-item" id="menuBackupLoad"><span class="mi-icon">⬆</span>バックアップを読み込む</button>
      </div>
      <div class="sheet-row" style="margin-top:10px;">
        <button class="sheet-btn cancel" id="menuCancel">閉じる</button>
      </div>
    </div>
  </div>

  <!-- Add task sheet -->
  <div class="overlay" id="taskOverlay">
    <div class="sheet" id="taskSheet">
      <div class="sheet-handle"></div>
      <p class="sheet-title">タスクを追加</p>
      <input type="text" id="taskInput" placeholder="タスク名を入力..." maxlength="80">
      <div class="sheet-row">
        <button class="sheet-btn cancel" id="taskCancel">キャンセル</button>
        <button class="sheet-btn primary" id="taskConfirm">追加</button>
      </div>
    </div>
  </div>

  <!-- Add category sheet -->
  <div class="overlay" id="catOverlay">
    <div class="sheet" id="catSheet">
      <div class="sheet-handle"></div>
      <p class="sheet-title">カテゴリを追加</p>
      <input type="text" id="catInput" placeholder="カテゴリ名を入力..." maxlength="20">
      <div class="sheet-row">
        <button class="sheet-btn cancel" id="catCancel">キャンセル</button>
        <button class="sheet-btn primary" id="catConfirm">追加</button>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept="application/json">
  <div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "todoAppData_v1";
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  function defaultData(){
    return {
      activeCategoryId: "home",
      categories: [
        { id:"home", name:"家", tasks:[] },
        { id:"bike", name:"自転車", tasks:[] },
        { id:"shopping", name:"買い物", tasks:[] }
      ]
    };
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultData();
      const parsed = JSON.parse(raw);
      if(!parsed.categories || !Array.isArray(parsed.categories) || parsed.categories.length === 0){
        return defaultData();
      }
      return parsed;
    }catch(e){
      return defaultData();
    }
  }

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  let state = load();

  function activeCategory(){
    return state.categories.find(c => c.id === state.activeCategoryId) || state.categories[0];
  }

  // ---------- Toast ----------
  let toastTimer = null;
  function showToast(msg, duration){
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el.classList.remove("show"), duration || 2200);
  }

  // ---------- Render ----------
  function render(){
    renderTabs();
    renderTasks();
  }

  function renderTabs(){
    const wrap = document.getElementById("tabs");
    wrap.innerHTML = "";
    state.categories.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "tab" + (cat.id === state.activeCategoryId ? " active" : "");
      btn.textContent = cat.name;
      btn.addEventListener("click", () => {
        state.activeCategoryId = cat.id;
        save();
        render();
      });
      wrap.appendChild(btn);
    });
  }

  function renderTasks(){
    const cat = activeCategory();
    const taskArea = document.getElementById("taskArea");
    const doneArea = document.getElementById("doneArea");
    const bulkBtn = document.getElementById("bulkDelBtn");

    const todo = cat.tasks.filter(t => !t.completed);
    const done = cat.tasks.filter(t => t.completed);

    // ---- incomplete ----
    if(todo.length === 0){
      taskArea.innerHTML = `
        <div class="empty-state">
          <div class="emoji">📝</div>
          <div class="line1">タスクなし</div>
          <div class="line2">右下の + から追加しよう</div>
        </div>`;
    }else{
      const list = document.createElement("div");
      list.className = "task-list";
      todo.forEach(t => list.appendChild(taskRow(t)));
      taskArea.innerHTML = "";
      taskArea.appendChild(list);
    }

    // ---- completed ----
    if(done.length === 0){
      doneArea.innerHTML = `
        <div class="empty-state">
          <div class="emoji">🌙</div>
          <div class="line1">完了済みなし</div>
        </div>`;
      bulkBtn.disabled = true;
    }else{
      const list = document.createElement("div");
      list.className = "task-list";
      done.forEach(t => list.appendChild(taskRow(t)));
      doneArea.innerHTML = "";
      doneArea.appendChild(list);
      bulkBtn.disabled = false;
    }
  }

  function taskRow(task){
    const row = document.createElement("div");
    row.className = "task-item";

    const check = document.createElement("div");
    check.className = "check" + (task.completed ? " checked" : "");
    check.addEventListener("click", () => {
      task.completed = !task.completed;
      save();
      renderTasks();
    });

    const text = document.createElement("div");
    text.className = "task-text" + (task.completed ? " done" : "");
    text.textContent = task.text;

    const del = document.createElement("button");
    del.className = "del-btn";
    del.innerHTML = "✕";
    del.addEventListener("click", () => {
      const cat = activeCategory();
      cat.tasks = cat.tasks.filter(t => t.id !== task.id);
      save();
      renderTasks();
    });

    row.appendChild(check);
    row.appendChild(text);
    row.appendChild(del);
    return row;
  }

  // ---------- Bulk delete completed ----------
  document.getElementById("bulkDelBtn").addEventListener("click", () => {
    const cat = activeCategory();
    const doneCount = cat.tasks.filter(t => t.completed).length;
    if(doneCount === 0) return;
    if(!confirm(`完了済みタスクを${doneCount}件削除しますか？`)) return;
    cat.tasks = cat.tasks.filter(t => !t.completed);
    save();
    renderTasks();
  });

  // =====================================================
  // Keyboard-safe bottom sheet handling
  // Tracks visualViewport so the sheet (and its buttons)
  // always stay above the on-screen keyboard.
  //
  // Android fires the visualViewport "resize" event repeatedly
  // WHILE the keyboard is still sliding up (not just once at the
  // end), so reacting to the first event reveals the sheet at an
  // intermediate, not-yet-final height -> visible jumping as later
  // events correct it. To avoid that, sheets with a text input:
  //   1. show the dark backdrop immediately + focus the input
  //   2. wait until resize events STOP firing for a short moment
  //      (meaning the keyboard has finished its own animation)
  //   3. only then run the slide-in transition once, already
  //      positioned at the keyboard's final, settled height
  // Sheets with no input (the top "+" menu) skip this and slide
  // in immediately, since there's no keyboard to wait for.
  // =====================================================
  function bindOverlayToViewport(overlay){
    function apply(){
      if(window.visualViewport){
        const vv = window.visualViewport;
        overlay.style.height = vv.height + "px";
        overlay.style.top = vv.offsetTop + "px";
      }else{
        overlay.style.height = "100%";
        overlay.style.top = "0";
      }
    }
    apply();

    // background tracking (rotation, keyboard toggling while a sheet
    // is already fully open) - debounced so it doesn't fight with the
    // open-time settle logic below
    let bgTimer = null;
    function scheduleApply(){
      clearTimeout(bgTimer);
      bgTimer = setTimeout(apply, 80);
    }
    if(window.visualViewport){
      window.visualViewport.addEventListener("resize", scheduleApply);
      window.visualViewport.addEventListener("scroll", scheduleApply);
    }
    window.addEventListener("orientationchange", apply);

    return apply; // exposed for immediate/manual calls
  }

  // bind each overlay to the viewport once, up front, so listeners
  // don't stack up every time a sheet is opened
  const overlayUpdaters = {};
  [ "menuOverlay", "taskOverlay", "catOverlay" ].forEach(id => {
    overlayUpdaters[id] = bindOverlayToViewport(document.getElementById(id));
  });

  function hideOverlay(overlayId){
    const overlay = document.getElementById(overlayId);
    const sheet = overlay.querySelector(".sheet");
    const focused = overlay.querySelector("input:focus");
    sheet.classList.remove("shown");
    if(focused) focused.blur(); // closes the keyboard
    const onEnd = () => {
      overlay.classList.remove("open");
      sheet.removeEventListener("transitionend", onEnd);
    };
    sheet.addEventListener("transitionend", onEnd);
  }

  // sheets with no keyboard involved (top "+" menu): slide in right away
  function openSimpleSheet(overlayId){
    const overlay = document.getElementById(overlayId);
    overlayUpdaters[overlayId]();
    overlay.classList.add("open");
    const sheet = overlay.querySelector(".sheet");
    requestAnimationFrame(() => sheet.classList.add("shown"));
  }

  // sheets with a text input: show backdrop + focus first, then wait
  // for the keyboard animation to fully settle before sliding in once
  function openInputSheet(overlayId, inputEl){
    const overlay = document.getElementById(overlayId);
    overlayUpdaters[overlayId](); // size backdrop to current (pre-keyboard) viewport
    overlay.classList.add("open");
    const sheet = overlay.querySelector(".sheet");

    inputEl.focus({ preventScroll: true });

    let revealed = false;
    function reveal(){
      if(revealed) return;
      revealed = true;
      overlayUpdaters[overlayId](); // lock in the final, settled size
      sheet.classList.add("shown");
    }

    if(window.visualViewport){
      let settleTimer = null;
      const onResize = () => {
        // every time the viewport is still changing, push the reveal
        // further out - only fire once things stop moving
        clearTimeout(settleTimer);
        settleTimer = setTimeout(() => {
          window.visualViewport.removeEventListener("resize", onResize);
          reveal();
        }, 120);
      };
      window.visualViewport.addEventListener("resize", onResize);
      // absolute fallback in case resize never fires (desktop, or a
      // keyboard that was already open) so the sheet never gets stuck
      setTimeout(() => {
        window.visualViewport.removeEventListener("resize", onResize);
        reveal();
      }, 450);
    }else{
      setTimeout(reveal, 250);
    }
  }

  // close overlay when tapping the dark backdrop (not the sheet itself)
  [ "menuOverlay", "taskOverlay", "catOverlay" ].forEach(id => {
    const overlay = document.getElementById(id);
    overlay.addEventListener("click", (e) => {
      if(e.target === overlay) hideOverlay(id);
    });
  });

  // ---------- Add task sheet ----------
  const fab = document.getElementById("fabAdd");
  const taskInput = document.getElementById("taskInput");
  const taskConfirm = document.getElementById("taskConfirm");

  fab.addEventListener("click", () => {
    taskInput.value = "";
    openInputSheet("taskOverlay", taskInput);
  });
  document.getElementById("taskCancel").addEventListener("click", () => hideOverlay("taskOverlay"));

  function submitTask(){
    const val = taskInput.value.trim();
    if(!val) { taskInput.focus({ preventScroll: true }); return; }
    const cat = activeCategory();
    cat.tasks.unshift({ id: uid(), text: val, completed:false });
    save();
    renderTasks();
    hideOverlay("taskOverlay");
    showToast("タスクを追加しました");
  }
  taskConfirm.addEventListener("click", submitTask);
  taskInput.addEventListener("keydown", (e) => { if(e.key === "Enter") submitTask(); });

  // ---------- Top "+" menu ----------
  document.getElementById("openTopMenu").addEventListener("click", () => openSimpleSheet("menuOverlay"));
  document.getElementById("menuCancel").addEventListener("click", () => hideOverlay("menuOverlay"));

  document.getElementById("menuAddCategory").addEventListener("click", () => {
    hideOverlay("menuOverlay");
    const catInput = document.getElementById("catInput");
    catInput.value = "";
    // give the menu sheet a moment to finish closing before the next one opens
    setTimeout(() => openInputSheet("catOverlay", catInput), 200);
  });

  document.getElementById("menuDeleteCategory").addEventListener("click", () => {
    hideOverlay("menuOverlay");
    if(state.categories.length <= 1){
      showToast("最後の1つは削除できません");
      return;
    }
    const cat = activeCategory();
    if(!confirm(`「${cat.name}」を削除しますか？中のタスクも全て削除されます。`)) return;
    state.categories = state.categories.filter(c => c.id !== cat.id);
    state.activeCategoryId = state.categories[0].id;
    save();
    render();
    showToast("カテゴリを削除しました");
  });

  document.getElementById("menuBackupSave").addEventListener("click", () => {
    hideOverlay("menuOverlay");
    const d = new Date();
    const exportObj = {
      meta: { app:"todo-pwa", formatVersion:1, exportedAt: d.toISOString() },
      activeCategoryId: state.activeCategoryId,
      categories: state.categories
    };
    const dataStr = JSON.stringify(exportObj, null, 2);
    const blob = new Blob([dataStr], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const pad = n => String(n).padStart(2,"0");
    const fname = `ToDo-${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}.json`;
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast(`保存しました：${fname}`, 5000);
  });

  document.getElementById("menuBackupLoad").addEventListener("click", () => {
    hideOverlay("menuOverlay");
    document.getElementById("fileInput").click();
  });

  // ---------- Legacy (old app) backup conversion ----------
  // The old app's export shape looked like:
  //   { tabs: ["家","自転車","買い物"], activeTab: 0,
  //     data: { "家": { tasks: [...], done: [...] }, ... } }
  // Detect it and convert into this app's { activeCategoryId, categories } shape,
  // so people migrating from the old app don't lose their data.
  function convertLegacyBackup(old){
    if(!old || !Array.isArray(old.tabs) || !old.data || typeof old.data !== "object"){
      return null;
    }
    const toTask = (item, completed) => {
      if(typeof item === "string") return { id: uid(), text: item, completed };
      if(item && typeof item === "object"){
        const text = item.text || item.name || item.title || "";
        return { id: uid(), text: String(text), completed: !!(completed || item.completed || item.done) };
      }
      return { id: uid(), text: String(item), completed };
    };
    const categories = old.tabs.map(name => {
      const bucket = old.data[name] || {};
      const todo = Array.isArray(bucket.tasks) ? bucket.tasks : [];
      const done = Array.isArray(bucket.done) ? bucket.done : [];
      return {
        id: uid(),
        name: String(name),
        tasks: [
          ...todo.map(t => toTask(t, false)),
          ...done.map(t => toTask(t, true))
        ]
      };
    });
    if(categories.length === 0) return null;
    const idx = typeof old.activeTab === "number" ? old.activeTab : 0;
    const activeCategoryId = (categories[idx] || categories[0]).id;
    return { activeCategoryId, categories };
  }

  document.getElementById("fileInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      // strip a UTF-8 BOM if present (some editors/OSes add one, which
      // makes JSON.parse fail even though the content itself is valid)
      const raw = String(evt.target.result).replace(/^\uFEFF/, "").trim();

      let parsed;
      try{
        parsed = JSON.parse(raw);
      }catch(err){
        console.error("Backup load: JSON parse failed", err);
        showToast("読み込み失敗：JSONとして読み取れませんでした（ファイルが壊れているか、テキスト形式が異なります）");
        return;
      }

      if(!parsed || typeof parsed !== "object"){
        console.error("Backup load: unexpected structure", parsed);
        const preview = raw.slice(0, 120).replace(/\s+/g, " ");
        showToast(`読み込み失敗：形式が違います。内容の先頭: ${preview}`, 8000);
        return;
      }

      // this app's own format (has categories array, ideally with our meta signature)
      if(Array.isArray(parsed.categories)){
        if(parsed.categories.length === 0){
          showToast("読み込み失敗：カテゴリが0件のバックアップです");
          return;
        }
        const badCategory = parsed.categories.find(c => !c || typeof c.name !== "string" || !Array.isArray(c.tasks));
        if(badCategory){
          console.error("Backup load: malformed category", badCategory);
          showToast("読み込み失敗：カテゴリのデータ形式が不正です");
          return;
        }
        const fromThisApp = parsed.meta && parsed.meta.app === "todo-pwa";
        const msg = fromThisApp
          ? "現在のデータを上書きして読み込みますか？"
          : "meta情報がない古い形式ですが、構造は読み込めそうです。現在のデータを上書きして読み込みますか？";
        if(!confirm(msg)) return;
        state = { activeCategoryId: parsed.activeCategoryId, categories: parsed.categories };
        if(!state.activeCategoryId || !state.categories.some(c => c.id === state.activeCategoryId)){
          state.activeCategoryId = state.categories[0].id;
        }
        save();
        render();
        showToast("バックアップを読み込みました");
        return;
      }

      // legacy (old app) format: { tabs, activeTab, data }
      const converted = convertLegacyBackup(parsed);
      if(converted){
        if(!confirm(`旧アプリの形式のバックアップを検出しました（カテゴリ${converted.categories.length}件）。変換して読み込みますか？現在のデータは上書きされます。`)) return;
        state = converted;
        save();
        render();
        showToast("旧形式のバックアップを変換して読み込みました");
        return;
      }

      console.error("Backup load: unrecognized structure", parsed);
      const preview = raw.slice(0, 120).replace(/\s+/g, " ");
      showToast(`読み込み失敗：このアプリの形式でも旧アプリの形式でもないようです。内容の先頭: ${preview}`, 8000);
    };
    reader.onerror = () => {
      console.error("Backup load: FileReader error", reader.error);
      showToast("読み込み失敗：ファイルを読み取れませんでした");
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  // ---------- Add category sheet ----------
  const catInput = document.getElementById("catInput");
  const catConfirm = document.getElementById("catConfirm");
  document.getElementById("catCancel").addEventListener("click", () => hideOverlay("catOverlay"));

  function submitCategory(){
    const val = catInput.value.trim();
    if(!val){ catInput.focus({ preventScroll: true }); return; }
    const newCat = { id: uid(), name: val, tasks: [] };
    state.categories.push(newCat);
    state.activeCategoryId = newCat.id;
    save();
    render();
    hideOverlay("catOverlay");
    showToast("カテゴリを追加しました");
  }
  catConfirm.addEventListener("click", submitCategory);
  catInput.addEventListener("keydown", (e) => { if(e.key === "Enter") submitCategory(); });

  // ---------- init ----------
  render();

  // ---------- PWA: service worker registration ----------
  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch((err) => {
        console.warn("Service worker registration failed:", err);
      });
    });
  }
})();
</script>
</body>
</html>
