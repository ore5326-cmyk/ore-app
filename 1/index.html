<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ToDo</title>
  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#7c6aff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ToDo" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg:        #0d0f14;
      --surface:   #161a24;
      --surface2:  #1e2333;
      --border:    #2a2f45;
      --accent:    #7c6aff;
      --accent2:   #4f9aff;
      --success:   #3ecf8e;
      --danger:    #ff4f6a;
      --text:      #e8eaf0;
      --text-sub:  #7a82a0;
      --text-dim:  #4a5070;
      --radius:    16px;
      --tab-h:     54px;
      --safe-b:    env(safe-area-inset-bottom, 0px);
      --safe-l:    env(safe-area-inset-left, 0px);
      --safe-r:    env(safe-area-inset-right, 0px);
    }

    html {
      height: 100%;
      background: var(--bg);
    }

    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* ── APP SHELL ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh; /* dynamic viewport height for mobile browsers */
      width: 100%;
    }

    /* ── TAB BAR ── */
    #tab-bar {
      display: flex;
      align-items: center;
      height: var(--tab-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 8px 0 calc(8px + var(--safe-l));
      padding-right: calc(8px + var(--safe-r));
      gap: 4px;
      flex-shrink: 0;
    }

    #tab-list {
      display: flex;
      flex: 1;
      overflow-x: auto;
      gap: 6px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    #tab-list::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex-shrink: 0;
      height: 38px;
      padding: 0 18px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-sub);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, color .15s;
      white-space: nowrap;
      touch-action: manipulation;
    }
    .tab-btn:active { opacity: .7; }
    .tab-btn.active {
      background: linear-gradient(135deg, rgba(124,106,255,.28), rgba(79,154,255,.18));
      border-color: rgba(124,106,255,.45);
      color: var(--accent);
    }

    #tab-manage-btn {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-sub);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s;
      touch-action: manipulation;
    }
    #tab-manage-btn:active { background: var(--accent); color: #fff; }

    /* ── MAIN SCROLL AREA ── */
    #main {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 16px calc(96px + var(--safe-b));
      padding-left: calc(16px + var(--safe-l));
      padding-right: calc(16px + var(--safe-r));
    }

    /* ── SECTION HEADERS ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* ── TASK ITEMS ── */
    #task-list, #done-list { display: flex; flex-direction: column; gap: 10px; }

    .task-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 14px;
      animation: slideIn .2s ease;
      transition: border-color .15s;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .task-item:active { border-color: rgba(124,106,255,.4); }

    /* Checkbox */
    .check-btn {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .18s ease;
      position: relative;
      touch-action: manipulation;
    }
    .check-btn.done {
      border-color: var(--success);
      background: var(--success);
    }
    .check-btn.done::after {
      content: '';
      width: 7px;
      height: 12px;
      border-right: 2.5px solid #fff;
      border-bottom: 2.5px solid #fff;
      transform: rotate(45deg) translate(-1px,-1px);
    }
    .check-btn:active { transform: scale(.88); }

    /* Task Name */
    .task-name {
      flex: 1;
      font-size: 15px;
      font-weight: 400;
      color: var(--text);
      border: none;
      background: transparent;
      font-family: inherit;
      outline: none;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background .15s;
      min-width: 0;
      /* Prevent iOS zoom on focus */
      font-size: 16px;
    }
    .task-name:focus { background: rgba(124,106,255,.1); }
    .task-name.done-text {
      color: var(--text-dim);
      text-decoration: line-through;
    }

    /* Delete btn */
    .del-btn {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      transition: background .15s, color .15s;
    }
    .del-btn:active { background: rgba(255,79,106,.18); color: var(--danger); }

    /* ── COMPLETED SECTION ── */
    #done-section { margin-top: 32px; }

    #clear-all-btn {
      font-size: 12px;
      font-weight: 600;
      color: var(--danger);
      background: rgba(255,79,106,.1);
      border: 1px solid rgba(255,79,106,.25);
      border-radius: 8px;
      padding: 7px 14px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background .15s;
    }
    #clear-all-btn:active { background: rgba(255,79,106,.25); }

    /* Divider */
    .divider { height: 1px; background: var(--border); margin: 28px 0; }

    /* Empty state */
    .empty-state {
      text-align: center;
      color: var(--text-dim);
      padding: 36px 0;
      font-size: 14px;
      line-height: 1.6;
    }
    .empty-state .icon { font-size: 40px; margin-bottom: 10px; }

    /* ── FAB ── */
    #fab {
      position: fixed;
      bottom: calc(28px + var(--safe-b));
      right: calc(20px + var(--safe-r));
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 32px;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(124,106,255,.55);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .18s, box-shadow .18s;
      z-index: 100;
      touch-action: manipulation;
    }
    #fab:active { transform: scale(.92); box-shadow: 0 4px 14px rgba(124,106,255,.4); }

    /* ── MODAL OVERLAY ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 200;
      align-items: flex-end; /* sheet from bottom on mobile */
      justify-content: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      padding: 20px 20px calc(24px + var(--safe-b));
      width: 100%;
      max-height: 88dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 -16px 60px rgba(0,0,0,.6);
      animation: sheetUp .25s cubic-bezier(.32,0,.67,0);
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    /* Sheet handle */
    .modal::before {
      content: '';
      display: block;
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text);
    }

    /* ── INPUTS ── */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type=text] {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 16px; /* prevents iOS auto-zoom */
      color: var(--text);
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
      -webkit-appearance: none;
    }
    input[type=text]:focus { border-color: var(--accent); }
    input[type=text]::placeholder { color: var(--text-dim); }

    .btn-primary {
      padding: 13px 20px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      transition: opacity .15s;
      white-space: nowrap;
    }
    .btn-primary:active { opacity: .8; }

    .btn-ghost {
      padding: 13px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-sub);
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      touch-action: manipulation;
      transition: background .15s;
    }
    .btn-ghost:active { background: var(--surface2); }

    /* Tab manage list */
    #tab-manage-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 42dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 16px;
    }

    .tab-manage-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 14px;
    }

    .drag-handle {
      color: var(--text-dim);
      cursor: grab;
      font-size: 18px;
      padding: 0 4px;
      user-select: none;
      touch-action: none;
    }

    .tab-edit-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    .tab-del-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      transition: background .15s, color .15s;
    }
    .tab-del-btn:active { background: rgba(255,79,106,.18); color: var(--danger); }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Scrollbar (barely visible on mobile) */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

<div id="app">

  <!-- TAB BAR -->
  <div id="tab-bar">
    <div id="tab-list"></div>
    <button id="tab-manage-btn" title="タブを管理">+</button>
  </div>

  <!-- MAIN SCROLL -->
  <div id="main">
    <div class="section-header">
      <span class="section-title">タスク</span>
    </div>
    <div id="task-list"></div>

    <div class="divider"></div>

    <div id="done-section">
      <div class="section-header">
        <span class="section-title">完了</span>
        <button id="clear-all-btn">一括削除</button>
      </div>
      <div id="done-list"></div>
    </div>
  </div>

  <!-- FAB -->
  <button id="fab" title="タスクを追加">+</button>

</div>

<!-- ════ TAB MANAGE MODAL ════ -->
<div class="modal-overlay" id="tab-modal-overlay">
  <div class="modal">
    <div class="modal-title">タブを管理</div>
    <div class="input-row">
      <input type="text" id="new-tab-input" placeholder="新しいタブ名…" maxlength="20" />
      <button class="btn-primary" id="add-tab-btn">追加</button>
    </div>
    <div id="tab-manage-list"></div>
    <div class="modal-footer">
      <button class="btn-ghost" id="tab-modal-close">閉じる</button>
      <button class="btn-primary" id="tab-modal-save">保存</button>
    </div>
  </div>
</div>

<!-- ════ ADD TASK MODAL ════ -->
<div class="modal-overlay" id="add-task-modal">
  <div class="modal">
    <div class="modal-title">タスクを追加</div>
    <div class="input-row">
      <input type="text" id="new-task-input" placeholder="タスク名を入力…" maxlength="80" />
      <button class="btn-primary" id="confirm-add-task">追加</button>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" id="cancel-add-task">キャンセル</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let state = {
  tabs: ['家', '自転車', '買い物'],
  activeTab: 0,
  data: {}
};

function getTab() { return state.tabs[state.activeTab]; }
function getData() {
  const t = getTab();
  if (!state.data[t]) state.data[t] = { tasks: [], done: [] };
  return state.data[t];
}
function uid() { return Math.random().toString(36).slice(2, 10); }

/* ══════════════════════════════════════════
   PERSIST
══════════════════════════════════════════ */
function save() { localStorage.setItem('dolist_v3', JSON.stringify(state)); }
function load() {
  try {
    const s = localStorage.getItem('dolist_v3');
    if (s) state = JSON.parse(s);
    if (!state.tabs || !state.tabs.length) state.tabs = ['家', '自転車', '買い物'];
    if (state.activeTab >= state.tabs.length) state.activeTab = 0;
  } catch (e) {}
}

/* ══════════════════════════════════════════
   RENDER
══════════════════════════════════════════ */
function renderTabs() {
  const list = document.getElementById('tab-list');
  list.innerHTML = '';
  state.tabs.forEach((name, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === state.activeTab ? ' active' : '');
    btn.textContent = name;
    btn.onclick = () => { state.activeTab = i; save(); render(); };
    list.appendChild(btn);
  });
}

function renderTasks() {
  const d = getData();
  const taskList = document.getElementById('task-list');
  const doneList = document.getElementById('done-list');

  taskList.innerHTML = '';
  if (!d.tasks.length) {
    taskList.innerHTML = '<div class="empty-state"><div class="icon">📝</div>タスクなし<br>右下の ＋ から追加しよう</div>';
  } else {
    d.tasks.forEach(t => taskList.appendChild(makeItem(t, false)));
  }

  doneList.innerHTML = '';
  if (!d.done.length) {
    doneList.innerHTML = '<div class="empty-state"><div class="icon">🌙</div>完了済みなし</div>';
  } else {
    d.done.forEach(t => doneList.appendChild(makeItem(t, true)));
  }
}

function render() { renderTabs(); renderTasks(); }

function makeItem(task, isDone) {
  const d = getData();
  const item = document.createElement('div');
  item.className = 'task-item';

  /* Checkbox */
  const chk = document.createElement('button');
  chk.className = 'check-btn' + (isDone ? ' done' : '');
  chk.onclick = () => {
    if (isDone) {
      d.done = d.done.filter(x => x.id !== task.id);
      d.tasks.unshift(task);
    } else {
      d.tasks = d.tasks.filter(x => x.id !== task.id);
      d.done.unshift(task);
    }
    save(); renderTasks();
  };

  /* Name */
  const name = document.createElement('input');
  name.type = 'text';
  name.className = 'task-name' + (isDone ? ' done-text' : '');
  name.value = task.name;
  name.inputMode = 'text';
  name.onblur = () => {
    const val = name.value.trim();
    if (val && val !== task.name) { task.name = val; save(); }
    else name.value = task.name;
  };
  name.onkeydown = e => { if (e.key === 'Enter') name.blur(); };

  /* Delete */
  const del = document.createElement('button');
  del.className = 'del-btn';
  del.innerHTML = trashSVG();
  del.onclick = () => {
    if (isDone) d.done = d.done.filter(x => x.id !== task.id);
    else        d.tasks = d.tasks.filter(x => x.id !== task.id);
    save(); renderTasks();
  };

  item.appendChild(chk);
  item.appendChild(name);
  item.appendChild(del);
  return item;
}

function trashSVG() {
  return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="3 6 5 6 21 6"/>
    <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
    <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
  </svg>`;
}

/* ══════════════════════════════════════════
   ADD TASK
══════════════════════════════════════════ */
const addModal = document.getElementById('add-task-modal');
const newTaskInput = document.getElementById('new-task-input');

document.getElementById('fab').onclick = () => {
  newTaskInput.value = '';
  addModal.classList.add('open');
  setTimeout(() => newTaskInput.focus(), 80);
};
document.getElementById('cancel-add-task').onclick = () => addModal.classList.remove('open');
addModal.addEventListener('click', e => { if (e.target === addModal) addModal.classList.remove('open'); });

function addTask() {
  const val = newTaskInput.value.trim();
  if (!val) return;
  getData().tasks.push({ id: uid(), name: val });
  save(); renderTasks();
  addModal.classList.remove('open');
}
document.getElementById('confirm-add-task').onclick = addTask;
newTaskInput.onkeydown = e => { if (e.key === 'Enter') addTask(); if (e.key === 'Escape') addModal.classList.remove('open'); };

/* ══════════════════════════════════════════
   CLEAR DONE
══════════════════════════════════════════ */
document.getElementById('clear-all-btn').onclick = () => {
  if (!getData().done.length) return;
  getData().done = [];
  save(); renderTasks();
};

/* ══════════════════════════════════════════
   TAB MANAGE
══════════════════════════════════════════ */
const tabModal = document.getElementById('tab-modal-overlay');
let tempTabs = [];
let dragSrc = null;

document.getElementById('tab-manage-btn').onclick = () => {
  tempTabs = [...state.tabs];
  renderTabManageList();
  tabModal.classList.add('open');
  document.getElementById('new-tab-input').value = '';
};
document.getElementById('tab-modal-close').onclick = () => tabModal.classList.remove('open');
tabModal.addEventListener('click', e => { if (e.target === tabModal) tabModal.classList.remove('open'); });

document.getElementById('add-tab-btn').onclick = () => {
  const val = document.getElementById('new-tab-input').value.trim();
  if (!val || tempTabs.includes(val)) return;
  tempTabs.push(val);
  document.getElementById('new-tab-input').value = '';
  renderTabManageList();
};
document.getElementById('new-tab-input').onkeydown = e => {
  if (e.key === 'Enter') document.getElementById('add-tab-btn').click();
};

document.getElementById('tab-modal-save').onclick = () => {
  if (!tempTabs.length) return;
  const cur = state.tabs[state.activeTab];
  state.tabs = [...tempTabs];
  const idx = state.tabs.indexOf(cur);
  state.activeTab = idx >= 0 ? idx : 0;
  save(); render();
  tabModal.classList.remove('open');
};

function renderTabManageList() {
  const container = document.getElementById('tab-manage-list');
  container.innerHTML = '';
  tempTabs.forEach((name, i) => {
    const item = document.createElement('div');
    item.className = 'tab-manage-item';
    item.draggable = true;
    item.dataset.idx = i;

    const handle = document.createElement('span');
    handle.className = 'drag-handle';
    handle.textContent = '⠿';

    const inp = document.createElement('input');
    inp.className = 'tab-edit-input';
    inp.type = 'text';
    inp.value = name;
    inp.maxLength = 20;
    inp.onchange = () => { tempTabs[i] = inp.value.trim() || name; };

    const delBtn = document.createElement('button');
    delBtn.className = 'tab-del-btn';
    delBtn.innerHTML = trashSVG();
    delBtn.onclick = () => {
      if (tempTabs.length === 1) return;
      tempTabs.splice(i, 1);
      renderTabManageList();
    };

    /* Drag */
    item.addEventListener('dragstart', e => {
      dragSrc = i;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => item.style.opacity = '.4', 0);
    });
    item.addEventListener('dragend', () => { item.style.opacity = ''; });
    item.addEventListener('dragover', e => { e.preventDefault(); });
    item.addEventListener('drop', e => {
      e.preventDefault();
      if (dragSrc === null || dragSrc === i) return;
      const moved = tempTabs.splice(dragSrc, 1)[0];
      tempTabs.splice(i, 0, moved);
      dragSrc = null;
      renderTabManageList();
    });

    /* Touch drag (for mobile) */
    let touchStartY = 0;
    handle.addEventListener('touchstart', e => {
      touchStartY = e.touches[0].clientY;
      dragSrc = i;
    }, { passive: true });
    handle.addEventListener('touchend', e => {
      const endY = e.changedTouches[0].clientY;
      const delta = endY - touchStartY;
      if (Math.abs(delta) < 10) return;
      const target = delta > 0
        ? Math.min(tempTabs.length - 1, i + 1)
        : Math.max(0, i - 1);
      if (target !== i) {
        const moved = tempTabs.splice(i, 1)[0];
        tempTabs.splice(target, 0, moved);
        renderTabManageList();
      }
      dragSrc = null;
    }, { passive: true });

    item.appendChild(handle);
    item.appendChild(inp);
    item.appendChild(delBtn);
    container.appendChild(item);
  });
}

/* ══════════════════════════════════════════
   SWIPE TO CHANGE TAB
══════════════════════════════════════════ */
(function initSwipeTabs() {
  const main = document.getElementById('main');
  let startX = 0, startY = 0, tracking = false;

  const SWIPE_MIN = 60;
  const SWIPE_RATIO = 1.4;

  function canSwipe() {
    if (tabModal.classList.contains('open') || addModal.classList.contains('open')) return false;
    const el = document.activeElement;
    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return false;
    return true;
  }

  function switchTabBy(dir) {
    const next = state.activeTab + dir;
    if (next < 0 || next >= state.tabs.length) return;
    state.activeTab = next;
    save();
    render();
    const list = document.getElementById('tab-list');
    const activeBtn = list.children[state.activeTab];
    if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }

  main.addEventListener('touchstart', e => {
    if (!canSwipe() || e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, { passive: true });

  main.addEventListener('touchmove', e => {
    if (!tracking) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 12) tracking = false;
  }, { passive: true });

  main.addEventListener('touchend', e => {
    if (!tracking) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) < SWIPE_MIN) return;
    if (Math.abs(dx) < Math.abs(dy) * SWIPE_RATIO) return;
    switchTabBy(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
load();
render();
